<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bem-vindos ao Claude Code</title>
<style>
  :root { --bg:#faf9f5; --fg:#1f1e1d; --muted:#6b6a68; --accent:#d97757; --card:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1f1e1d; --fg:#faf9f5; --muted:#a8a7a3; --card:#2a2928; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font-family: Georgia, "Times New Roman", serif; padding: 24px;
  }
  main {
    max-width: 640px; text-align: center; background: var(--card);
    padding: 48px 32px; border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
  }
  .logo { width: 96px; height: 96px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 24px 0 8px; }
  p.sub { color: var(--muted); font-family: system-ui, sans-serif; margin: 0 0 32px; }
  blockquote {
    margin: 0; padding: 20px 24px; font-size: 1.25rem; font-style: italic;
    border-left: 4px solid var(--accent); text-align: left; line-height: 1.5;
  }
  footer { margin-top: 32px; color: var(--muted); font-family: system-ui, sans-serif; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <!-- Logo estilizado do Claude (estrela de 12 pontas) -->
  <svg class="logo" viewBox="-50 -50 100 100" aria-label="Logo do Claude" role="img">
    <g fill="#d97757">
      <rect x="-4" y="-46" width="8" height="40" rx="4"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(30)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(60)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(90)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(120)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(150)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(180)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(210)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(240)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(270)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(300)"/>
      <rect x="-4" y="-46" width="8" height="40" rx="4" transform="rotate(330)"/>
    </g>
  </svg>
  <h1>Bem-vindos, alunos do Claude Code!</h1>
  <p class="sub">Sua jornada para construir com IA começa agora.</p>
  <blockquote>
    “Todo grande projeto começa com uma única linha de código — e com a coragem de começar.”
  </blockquote>
  <footer>Boas descobertas e bom código! 🚀</footer>
</main>
</body>
</html>
